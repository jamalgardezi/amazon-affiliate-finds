name: Enrich Amazon product images

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/enrich-images.yml"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download public Amazon product sample
        run: |
          curl -L --fail --retry 3             https://raw.githubusercontent.com/luminati-io/Amazon-dataset-samples/main/amazon-products.csv             -o /tmp/amazon-products.csv
      - name: Match ASINs and fill missing images
        run: |
          python - <<'PY'
          import csv, json, re, sys
          from pathlib import Path
          csv.field_size_limit(sys.maxsize)

          csv_path = Path("/tmp/amazon-products.csv")
          products_path = Path("products.js")

          image_map = {}
          with csv_path.open("r", encoding="utf-8-sig", newline="") as f:
              for row in csv.DictReader(f):
                  asin = (row.get("asin") or "").strip()
                  image = (row.get("image_url") or "").strip()
                  if asin and image and image.startswith(("https://m.media-amazon.com/", "https://images-na.ssl-images-amazon.com/")):
                      image_map[asin] = image

          text = products_path.read_text(encoding="utf-8")
          m = re.fullmatch(r"const PRODUCTS=(.*);\s*", text, flags=re.S)
          if not m:
              raise SystemExit("Could not parse products.js")
          products = json.loads(m.group(1))

          matched = updated = 0
          for p in products:
              asin = str(p.get("asin") or "").strip()
              image = image_map.get(asin)
              if image:
                  matched += 1
                  if not p.get("image"):
                      p["image"] = image
                      updated += 1

          products_path.write_text(
              "const PRODUCTS=" + json.dumps(products, ensure_ascii=False, separators=(",", ":")) + ";\n",
              encoding="utf-8"
          )
          print(f"Dataset image ASINs: {len(image_map)}")
          print(f"Catalog exact ASIN matches: {matched}")
          print(f"New images added: {updated}")
          PY
      - name: Commit image updates
        run: |
          if git diff --quiet -- products.js; then
            echo "No matching missing images found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.js
          git commit -m "Add Amazon product images from public ASIN dataset"
          git push
