name: Enrich Amazon product images

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/enrich-images.yml"

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Resolve images for catalog ASINs
        run: |
          python - <<'PY'
          import json, re, time, html
          import urllib.request
          from pathlib import Path

          path = Path("products.js")
          raw = path.read_text(encoding="utf-8")
          m = re.search(r"const\s+PRODUCTS\s*=\s*(\[.*\])\s*;?\s*$", raw, re.S)
          if not m:
              raise SystemExit("Could not parse products.js")
          products = json.loads(m.group(1))

          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9",
              "Accept": "text/html,application/xhtml+xml"
          }

          patterns = [
              r'id="landingImage"[^>]+(?:data-old-hires|src)="([^"]+)"',
              r'"hiRes":"(https:[^"]+)"',
              r'"large":"(https:[^"]+)"',
              r'<meta\s+property="og:image"\s+content="([^"]+)"'
          ]

          updated = attempted = failed = 0
          for i,p in enumerate(products):
              if p.get("image"):
                  continue
              asin = str(p.get("asin") or "").strip()
              if not asin:
                  continue
              attempted += 1
              url = "https://www.amazon.com/dp/" + asin
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      page = resp.read().decode("utf-8", "ignore")
                  image = ""
                  for pat in patterns:
                      mm = re.search(pat, page, re.I)
                      if mm:
                          image = html.unescape(mm.group(1)).replace("\\u0026","&").replace("\\/","/")
                          break
                  if image.startswith("https://") and ("media-amazon.com" in image or "ssl-images-amazon.com" in image):
                      p["image"] = image
                      updated += 1
                  else:
                      failed += 1
              except Exception:
                  failed += 1
              if attempted % 50 == 0:
                  print(f"Attempted {attempted}; images found {updated}; unresolved {failed}", flush=True)
              time.sleep(0.35)

          path.write_text("const PRODUCTS=" + json.dumps(products, ensure_ascii=False, separators=(",",":")) + ";\n", encoding="utf-8")
          print(f"Attempted: {attempted}")
          print(f"New images added: {updated}")
          print(f"Still unresolved: {failed}")
          PY
      - name: Commit image updates
        run: |
          if git diff --quiet -- products.js; then
            echo "No new images found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.js
          git commit -m "Add Amazon product images by exact ASIN"
          git push
